#brand{position:fixed;left:calc(16px + var(--sal));top:calc(14px + var(--sat));padding:12px 16px}

button{font:inherit;font-size:12px;letter-spacing:.03em;color:var(--cream);background:transparent;border:1px solid transparent;border-radius:9px;padding:7px 11px;cursor:pointer;transition:.15s}
button:hover{background:rgba(255,255,255,.1)}button.on{background:var(--copper);color:#1a1008;font-weight:600}
.sep{width:1px;background:rgba(255,255,255,.15);margin:4px 3px}

.q{margin-bottom:6px}.q b{font-size:10px;opacity:.75;display:inline-block;width:24px}

.q i:hover{outline:1px solid var(--cream)}

.badge{display:inline-block;font-size:10px;letter-spacing:.1em;padding:3px 8px;border-radius:20px;color:#07131c;font-weight:700;vertical-align:middle;margin-left:8px}
.kv{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:12px 0}.kv small{display:block;font-size:9px;letter-spacing:.14em;opacity:.6}.kv div{font-size:15px}
.price{font:600 26px Georgia,serif;margin:2px 0 8px}
.row{display:flex;justify-content:space-between;font-size:12px;padding:3px 0;border-bottom:1px solid rgba(255,255,255,.08)}
.nav{display:flex;justify-content:space-between;margin-top:10px;font-size:11px}
#tip{position:fixed;pointer-events:none;padding:5px 9px;font-size:12px;border-radius:8px;background:rgba(10,24,34,.94);border:1px solid rgba(255,255,255,.2);display:none;white-space:nowrap;z-index:5}
#foot{position:fixed;right:calc(16px + var(--sar));bottom:calc(12px + var(--sab));font-size:10px;opacity:.7;text-align:right;max-width:360px;line-height:1.4;text-shadow:0 1px 2px rgba(0,0,0,.7)}
#compass{position:fixed;right:calc(18px + var(--sar));top:calc(80px + var(--sat));width:54px;height:54px;border-radius:50%;padding:0}
#compass i{position:absolute;left:50%;top:50%;width:0;height:0;border-left:6px solid transparent;border-right:6px solid transparent;border-bottom:20px solid #e6b27f;transform-origin:50% 100%;margin:-20px 0 0 -6px}
#compass b{position:absolute;left:0;right:0;top:3px;text-align:center;font-size:10px;letter-spacing:.1em}
.edbar{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(18px + var(--sab));display:flex;gap:10px;align-items:center;padding:8px 10px 8px 14px;z-index:15;font-size:12px}
.edbar[hidden]{display:none!important}.edbar b{color:#ffb27a;letter-spacing:.08em;font-size:11px}
.edbar button.save{background:#FF5C00;color:#1a0a00;font-weight:700}.edbar button.save:disabled{opacity:.5;cursor:default}
.stbtns{display:flex;gap:6px;margin:10px 0 2px}.stbtns button{flex:1;border:1px solid rgba(255,255,255,.18);font-size:11px;padding:7px 4px}

#load{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:#0b1720;font-size:12px;letter-spacing:.2em;transition:opacity .8s;z-index:20}

  try{const pend=JSON.parse(sessionStorage.getItem('dps-pend')||'null');if(pend&&pend.length===D.lots.length){pend.forEach((s,i)=>{if(D.lots[i].s!==s)setStatus(i,s)})}}catch(e){}
  if(sel)card(sel)}catch(e){}})();
function select(o,fly){if(sel){sel.ov.material=statusM[sel.s];sel.hl.visible=hl&&sel.s==='d'}
  sel=o;if(!o){$('card').style.display='none';return}
  o.ov.material=selM;o.hl.visible=true;card(o);
  if(fly){const d=95;tween(new THREE.Vector3(o.cx+d*.35,d*.7,o.cz+d*.75),new THREE.Vector3(o.cx,0,o.cz))}}
function step(dir){const a=D.lots.filter(o=>o.s==='d');if(!a.length)return;let i=sel?a.indexOf(sel):-1;
  if(i<0){const b=sel?D.lots.indexOf(sel):0;i=dir>0?a.findIndex(o=>D.lots.indexOf(o)>b)-1:a.findIndex(o=>D.lots.indexOf(o)>=b);if(i<-1)i=-1}
  select(a[(i+dir+a.length)%a.length],true)}
// ---------- interação ----------
const ray=new THREE.Raycaster(),mv=new THREE.Vector2();let hov=null,down=null;
function pick(e){const r=cv.getBoundingClientRect();mv.set((e.clientX-r.left)/r.width*2-1,-(e.clientY-r.top)/r.height*2+1);ray.setFromCamera(mv,C);const h=ray.intersectObjects(lotMeshes);return h.length?h[0].object.userData:null}
cv.addEventListener('pointermove',e=>{const o=pick(e);hov=o;cv.style.cursor=o?'pointer':'grab';const t=$('tip');
  if(o){t.style.display='block';t.style.left=e.clientX+14+'px';t.style.top=e.clientY+14+'px';t.textContent=`Q-${o.q} · Lote ${o.n} · ${o.area.toLocaleString('pt-BR',{minimumFractionDigits:2})} m² · ${ST[o.s].n.charAt(0)+ST[o.s].n.slice(1).toLowerCase()}`}else t.style.display='none'});
cv.addEventListener('pointerdown',e=>down=[e.clientX,e.clientY]);
cv.addEventListener('pointerup',e=>{if(down&&Math.hypot(e.clientX-down[0],e.clientY-down[1])<5){const o=pick(e);if(o)select(o)}down=null});
document.querySelectorAll('[data-cam]').forEach(b=>b.onclick=()=>{moved=true;goCam(b.dataset.cam)});
$('bd').onclick=()=>setMode('dia');$('bt2').onclick=()=>setMode('tarde');$('bn').onclick=()=>setMode('noite');
$('bs').onclick=()=>{showStatus=!showStatus;$('bs').classList.toggle('on',showStatus);statusM.d.visible=statusM.r.visible=statusM.v.visible=showStatus};
$('bh').onclick=()=>{hl=!hl;$('bh').classList.toggle('on',hl);D.lots.forEach(o=>o.hl.visible=(hl&&o.s==='d')||o===sel)};
$('bq').onclick=()=>{const v=!qLabels[0].visible;qLabels.forEach(s=>s.visible=v);$('bq').classList.toggle('on',v)};
$('bnum').onclick=()=>{lotNums.visible=!lotNums.visible;$('bnum').classList.toggle('on',lotNums.visible)};
$('bsc').onclick=()=>{moved=true;const q=hwAt(HW.entry_s),tg=new THREE.Vector3(q.x-q.n[0]*110,0,q.z-q.n[1]*110);tween(new THREE.Vector3(q.x+q.n[0]*330+q.n[2]*260,150,q.z+q.n[1]*330+q.n[3]*260),tg)};
$('bt').onclick=()=>{traffic=!traffic;$('bt').classList.toggle('on',traffic);carsG.visible=traffic};
$('bg').onclick=()=>{ctl.autoRotate=!ctl.autoRotate;$('bg').classList.toggle('on',ctl.autoRotate)};
let moved=false;['pointerdown','wheel'].forEach(ev=>cv.addEventListener(ev,()=>moved=true,{passive:true}));
function rs(){if(!innerWidth||!innerHeight)return;R.setSize(innerWidth,innerHeight,false);C.aspect=innerWidth/innerHeight;
  if(innerWidth>760)C.setViewOffset(innerWidth,innerHeight,-90,0,innerWidth,innerHeight);else C.setViewOffset(innerWidth,innerHeight,0,Math.round(innerHeight*.07),innerWidth,innerHeight);
  C.updateProjectionMatrix();if(!moved&&!tw)initCam()}
addEventListener('resize',rs);
rs();initCam();setMode('dia');stats();mirror();
const SHEET='18BtY_LOP7U6OQi1Biy9G41E_LQG5l7E3HsDTfqFB1tI';
function parseCSV(s){const rows=[];let r=[],f='',q=false;for(let i=0;i<s.length;i++){const c=s[i];if(q){if(c==='"'){if(s[i+1]==='"'){f+='"';i++}else q=false}else f+=c}else if(c==='"')q=true;else if(c===','){r.push(f);f=''}else if(c==='\n'||c==='\r'){if(c==='\r'&&s[i+1]==='\n')i++;r.push(f);rows.push(r);r=[];f=''}else f+=c}if(f!==''||r.length){r.push(f);rows.push(r)}return rows}
function money(v){if(!v)return 0;v=String(v).replace(/[^\d,.-]/g,'');if(v.includes(','))v=v.replace(/\./g,'').replace(',','.');const n=parseFloat(v);return isFinite(n)?n:0}
async function loadSheet(){try{const r=await fetch('https://docs.google.com/spreadsheets/d/'+SHEET+'/gviz/tq?tqx=out:csv&headers=1&t='+Date.now(),{cache:'no-store'});if(!r.ok)throw new Error(r.status);
  const rows=parseCSV(await r.text());if(rows.length<2)return;const h=rows[0].map(x=>x.toLowerCase());
  const iq=h.findIndex(x=>x.includes('quadra')),il=h.findIndex(x=>x.includes('lote')),is=h.findIndex(x=>x.includes('status')),iv=h.findIndex(x=>x.includes('valor'));
  const by={};D.lots.forEach(o=>by[o.q+'-'+o.n]=o);let n=0;
  rows.slice(1).forEach(c=>{const o=by[String(c[iq]||'').trim().toUpperCase().replace(/^Q-?/,'')+'-'+parseInt(c[il])];if(!o)return;
    const st=String(c[is]||'').trim().toLowerCase(),s=st.startsWith('vend')?'v':st.startsWith('res')?'r':st.startsWith('disp')?'d':o.s;
    if(s!==o.s){o.s=s;if(sel!==o)o.ov.material=statusM[s];n++}o.valor=iv>=0?money(c[iv]):0});
  stats();mirror();if(sel)card(sel);const d=new Date();$('upd').textContent='Disponibilidade atualizada às '+d.toLocaleTimeString('pt-BR',{hour:'2-digit',minute:'2-digit'})+'.'}
  catch(e){$('upd').textContent=''}}
loadSheet();setInterval(()=>{if(!document.hidden)loadSheet()},120000);
setTimeout(()=>{$('load').style.opacity=0;setTimeout(()=>$('load').remove(),900)},300);
// ---------- loop ----------
let last=performance.now();
(function loop(t){requestAnimationFrame(loop);const dt=Math.min(.05,(t-last)/1000);last=t;
  if(tw){const k=Math.min(1,(performance.now()-tw.s)/1100),e=k<.5?2*k*k:1-Math.pow(-2*k+2,2)/2;C.position.lerpVectors(tw.p0,tw.p,e);ctl.target.lerpVectors(tw.t0,tw.t,e);if(k>=1)tw=null}
  if(traffic)cars.forEach(c=>{c.t+=c.v*dt*c.dir;const [p,a]=posOn(c.P,c.t);const nx=-Math.sin(a)*c.lane,nz=Math.cos(a)*c.lane;c.g.position.set(p.x+nx,.05,p.z+nz);c.g.rotation.y=-a+(c.dir<0?Math.PI:0)});
  const pu=.5+.5*Math.sin(t/500);statusM.d.opacity=.94+.06*pu;
  const dist=C.position.distanceTo(ctl.target),fade=Math.max(0,Math.min(1,(dist-120)/300));qLabels.forEach(s=>s.material.opacity=fade);lotLines.material.opacity=.6+.35*Math.min(1,dist/450);
  $('needle').style.transform=`rotate(${THREE.MathUtils.radToDeg(ctl.getAzimuthalAngle())}deg)`;
  updateNums();ctl.update();R.render(S,C)})(0);
</script>
